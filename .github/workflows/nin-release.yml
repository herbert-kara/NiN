name: NiN Windows release

on:
  push:
    tags:
      - 'v*-nin.*'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      draft_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Protect NiN customizations
        run: python .github/scripts/nin_guard.py
      - name: C# syntax pre-flight
        run: python .github/scripts/nin_cs_syntax.py
      - name: Automation unit tests
        run: python -B -m unittest discover -s .github/scripts -p 'test_nin*.py' -v
      - name: Tray palette tests
        run: |
          python -m pip install Pillow==12.1.1
          python -B -m unittest discover -s .github/scripts -p 'test_nin_identity.py'
      - name: Unit tests
        run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release --results-directory ./TestResults -- --report-trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: v2rayN/v2rayN.csproj
            package: NiN-windows-64
          - project: v2rayN.Desktop/v2rayN.Desktop.csproj
            package: NiN-windows-64-desktop
    env:
      PROJECT: ${{ matrix.project }}
      PACKAGE: ${{ matrix.package }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish app and updater
        shell: pwsh
        run: |
          $version = '7.25.1-nin.3'
          if ($env:RELEASE_TAG -match '^v[0-9]+\.[0-9]+\.[0-9]+-nin\.') { $version = $env:RELEASE_TAG.TrimStart('v') }
          $output = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE
          dotnet publish "v2rayN/$env:PROJECT" -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true "-p:Version=$version" -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish v2rayN/AmazTool/AmazTool.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishTrimmed=true "-p:Version=$version" -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$output/NiN.exe")) { throw 'Missing NiN.exe' }
          if ((Get-Item "$output/NiN.exe").VersionInfo.ProductName -ne 'NiN') { throw 'Incorrect product identity' }
      - name: Bundle cores and regional data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_TAG=$(python -c "import json; print(json.load(open('.github/nin-upstream.json'))['tag'])")
          curl -fL --retry 3 -o upstream.zip "https://github.com/patterniha/PattN/releases/download/$UPSTREAM_TAG/PattN-windows-64.zip"
          DIGEST=$(gh api "repos/patterniha/PattN/releases/tags/$UPSTREAM_TAG" --jq '.assets[] | select(.name == "PattN-windows-64.zip") | .digest')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid upstream SHA256 digest"; exit 1; }
          printf '%s  upstream.zip\n' "${DIGEST#sha256:}" | sha256sum -c -
          7z x -y upstream.zip -oupstream-package
          test -d upstream-package/PattN-windows-64/bin
          mkdir -p "$PACKAGE/bin"
          cp -a upstream-package/PattN-windows-64/bin/. "$PACKAGE/bin/"
          test -s "$PACKAGE/bin/xray/xray.exe"
          test -s "$PACKAGE/NiN.exe"
          cp LICENSE "$PACKAGE/LICENSE.txt"
          cp README.md "$PACKAGE/README.md"
      - name: Package and checksum
        shell: pwsh
        run: |
          Get-ChildItem $env:PACKAGE -Recurse -Filter *.pdb | Remove-Item
          # Archive the CONTENTS of $PACKAGE, not the folder itself. The in-app
          # updater extracts into the install directory and expects NiN.exe and
          # AmazTool.exe at its root; a leading NiN-windows-64/ entry nests them
          # one level too deep, so the updater writes a new tree beside the running
          # build and the old executable keeps launching without the new UI.
          Push-Location $env:PACKAGE
          try {
            7z a -tzip (Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE.zip") . -mx5
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE.zip"
          $entries = & 7z l -ba -slt $zip | Select-String '^Path = ' | ForEach-Object { $_.Line.Substring(7) }
          if (-not ($entries -contains 'NiN.exe')) { throw 'NiN.exe is not at the zip root' }
          if (-not ($entries -contains 'AmazTool.exe')) { throw 'AmazTool.exe is not at the zip root' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:PACKAGE.zip" | Set-Content "$env:PACKAGE.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.zip
            ${{ matrix.package }}.zip.sha256
          if-no-files-found: error

  release:
    if: github.repository == 'herbert-kara/NiN' && (inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: my-releases
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: NiN-windows-64*
          path: dist
          merge-multiple: true
      - name: Advance branch before standalone publication
        if: inputs.draft_only != true
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git merge --ff-only "$RELEASE_TAG"
          git push origin HEAD:my-releases
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          DRAFT_ONLY: ${{ inputs.draft_only }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          STATUS=$(jq -r --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0] | if . == null then "missing" elif .draft then "draft" else "published" end' releases.json)
          if [ "$STATUS" = published ]; then
            echo "Release already published; leaving assets immutable"
            exit 0
          fi
          if [ "$STATUS" = missing ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "NiN $RELEASE_TAG" --notes 'Personal PattN fork: NI application and status icons, NiN branding, bundled country flag images beside profile names. Country flags update automatically from public server IP lookup over HTTPS (ipwho.is); measured exit-country results take precedence. Only public IPs are submitted, never credentials. Server location can differ from exit location; unknown locations are not guessed. Windows x64 WPF and Avalonia portable packages. Unsigned binaries; SHA-256 checksums included. Unit tests and both UI builds must pass before upload. Device-side connection testing is still required.'
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
          if [ "$DRAFT_ONLY" != true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
