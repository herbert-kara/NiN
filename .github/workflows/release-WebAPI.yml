name: release v2rayN.WebAPI

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      exotic_arch: # PattN: also build linux-riscv64 (RISE runner) and linux-loongarch64 (emulated, 1-3 h)
        required: false
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example 7.x.y-P<n>).'
        required: true
        type: string
      exotic_arch: # PattN: also build linux-riscv64 (RISE runner) and linux-loongarch64 (emulated, 1-3 h)
        description: 'Also build linux-riscv64 and linux-loongarch64'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-WebAPI.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ inputs.release_tag }}
      exotic_arch: ${{ inputs.exotic_arch }}

  release-web-packages:
    name: sign and upload Web API packages
    # Upload through the shared signing flow, exactly like the desktop packages.
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: WebAPI-release-packages
      file_pattern: 'PattN-*-WebAPI*.zip'
    secrets: { GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}" }

  release-web-manifest:
    name: sign and upload Web update manifest
    if: inputs.release_tag != ''
    # Advertise the update only after its packages and manifest have been uploaded.
    needs: [build, release-web-packages]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: WebAPI-release-manifest
      file_pattern: 'WebAPI-update.json'
    secrets: { GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}" }
